<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veloce - Studio Kreatif Masuk</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="split-container">
        <section class="left-artwork-section">
            <img src="Arts.jpg" alt="Ilustrasi Seni Kreatif" class="artwork-image">
            <div class="art-overlay-content">
                <h3>Eksplorasi Kreativitas Tanpa Batas</h3>
                <p>Wujudkan inspirasi visual terbaikmu setiap hari.</p>
            </div>
        </section>

        <section class="right-section">
            <div class="login-wrapper">
                <div class="logo-area">
                    <span class="logo-text">Veloce<span class="dot">.</span></span>
                </div>

                <div class="form-header">
                    <h2>Selamat Datang Kembali</h2>
                    <p class="subtitle">Masuk untuk melanjutkan karya dan ide kreatifmu.</p>
                </div>

                <button type="button" class="btn-google" aria-label="Sign in with Google">
                    <svg class="google-icon" viewBox="0 0 24 24" width="18" height="18">
                        <path fill="#4285F4"
                            d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z" />
                        <path fill="#34A853"
                            d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.95H1.2v3.15C3.18 21.3 7.23 24 12 24z" />
                        <path fill="#FBBC05"
                            d="M5.28 14.25c-.25-.72-.38-1.49-.38-2.25s.13-1.53.38-2.25V6.6H1.2C.44 8.14 0 9.89 0 12s.44 3.86 1.2 5.4l4.08-3.15z" />
                        <path fill="#EA4335"
                            d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.18 2.7 1.2 6.6l4.08 3.15c.95-2.84 3.6-4.95 6.72-4.95z" />
                    </svg>
                    Sign in with Google
                </button>

                <div class="divider">
                    <span>Atau masuk dengan email</span>
                </div>

                <form action="#" method="POST">
                    <div class="input-group">
                        <label for="email">Email atau Username</label>
                        <input type="text" id="email" name="email" required placeholder="nama@domain.com">
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required placeholder="••••••••">
                    </div>

                    <div class="form-actions">
                        <label class="remember-me">
                            <input type="checkbox" name="remember"> Ingat saya
                        </label>
                        <a href="#" class="forgot-password">Lupa password?</a>
                    </div>

                    <button type="submit" class="btn-submit">Sign In</button>
                </form>

                <p class="signup-link">Belum punya akun? <a href="#">Daftar sekarang</a></p>
            </div>
        </section>
    </main>

</body>

</html>
